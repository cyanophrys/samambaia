    </main>
  </div>
  <smb-dialog id="script-dialog" style="--dialog-width: 420px;">
    <div class="scrollable-area">
      <form id="script-form" class="list-group rows-separated" data-action="saveScript">
        <input type="hidden" id="script-id" name="id">
        <div class="list-row field-row">
          <input class="input" type="text" id="script-name" name="name" placeholder=" " autocomplete="off" maxlength="128" required autofocus>
          <label class="label" for="script-name">Name</label>
        </div>
        <div class="list-row field-row multiline">
          <textarea class="textarea" id="script-content" name="content" placeholder=" " rows="5" maxlength="5000" required></textarea>
          <label class="label" for="script-content">Content</label>
        </div>
      </form>
    </div>
    <button slot="footer-left" class="button" type="button" data-action="closeDialog" data-target="script-dialog">Cancel</button>
    <button slot="footer-right" class="button suggested-action" type="submit" form="script-form"></button>
  </smb-dialog>
  <smb-dialog id="settings-dialog" dialog-title="Settings" style="--dialog-width: 420px;">
    <smb-stack id="settings-stack" transition homogeneous>
      <div data-page-name="appearance">
        <div class="scrollable-area">
          <section class="section">
            <header class="header">
              <h4 id="theme-section-title">Theme</h4>
            </header>
            <div class="list-group" role="radiogroup" aria-labelledby="theme-section-title">
              <label class="list-row activatable">
                <input class="radio prefix" type="radio" name="theme" value="system" data-action="setTheme">
                <span>System default</span>
              </label>
              <label class="list-row activatable">
                <input class="radio prefix" type="radio" name="theme" value="light" data-action="setTheme">
                <span>Light</span>
              </label>
              <label class="list-row activatable">
                <input class="radio prefix" type="radio" name="theme" value="dark" data-action="setTheme">
                <span>Dark</span>
              </label>
            </div>
          </section>
          <section class="section">
            <header class="header">
              <h4 id="accent-section-title">Accent colors</h4>
            </header>
            <div class="list-group rows-separated">
              <div class="list-row color-picker accent-color" role="radiogroup" aria-labelledby="accent-section-title">
                <input type="radio" name="accent-color" value="blue" data-action="setAccentColor" aria-label="Blue">
                <input type="radio" name="accent-color" value="teal" data-action="setAccentColor" aria-label="Teal">
                <input type="radio" name="accent-color" value="green" data-action="setAccentColor" aria-label="Green">
                <input type="radio" name="accent-color" value="yellow" data-action="setAccentColor" aria-label="Yellow">
                <input type="radio" name="accent-color" value="brown" data-action="setAccentColor" aria-label="Brown">
                <input type="radio" name="accent-color" value="orange" data-action="setAccentColor" aria-label="Orange">
                <input type="radio" name="accent-color" value="red" data-action="setAccentColor" aria-label="Red">
                <input type="radio" name="accent-color" value="pink" data-action="setAccentColor" aria-label="Pink">
                <input type="radio" name="accent-color" value="purple" data-action="setAccentColor" aria-label="Purple">
                <input type="radio" name="accent-color" value="lavender" data-action="setAccentColor" aria-label="Lavender">
                <input type="radio" name="accent-color" value="slate" data-action="setAccentColor" aria-label="Slate">
              </div>
            </div>
          </section>
        </div>
      </div>
      <div data-page-name="accessibility">
        <div class="scrollable-area">
          <section>
            <div class="list-group">
              <label class="list-row activatable">
                <input class="switch prefix" type="checkbox" role="switch" name="large-text" data-action="setLargeText">
                <div>
                  <span class="title">Large text</span>
                  <span class="subtitle">Increases the text size throughout the interface</span>
                </div>
              </label>
              <label class="list-row activatable">
                <input class="switch prefix" type="checkbox" role="switch" name="high-contrast" data-action="setHighContrast">
                <div>
                  <span class="title">High contrast</span>
                  <span class="subtitle">Increases color contrast to make the interface easier to see</span>
                </div>
              </label>
            </div>
          </section>
        </div>
      </div>
      <div data-page-name="storage">
        <div class="scrollable-area">
          <section class="section">
            <header class="header">
              <h4>Delete data</h4>
              <span class="dimmed description">Use the button below to permanently remove all local data.</span>
            </header>
            <button class="button big destructive-action" type="button" data-action="wipeData">Delete all data…</button>
          </section>
        </div>
      </div>
