  <style>

    body {

  <smb-dialog id="preferences-dialog" data-i18n-attr="heading:preferences" style="--dialog-width: 420px;">
    <div class="scrollable-area">
      <section class="section">
        <header>
          <h2 id="theme-heading" class="heading" data-i18n="theme"></h2>
        </header>
        <div class="list-group" role="radiogroup" aria-labelledby="theme-heading">
          <label class="list-row activatable">
            <input class="radio prefix" type="radio" name="theme" value="system" data-action="setTheme">
            <span data-i18n="systemDefault"></span>
          </label>
          <label class="list-row activatable">
            <input class="radio prefix" type="radio" name="theme" value="light" data-action="setTheme">
            <span data-i18n="light"></span>
          </label>
          <label class="list-row activatable">
            <input class="radio prefix" type="radio" name="theme" value="dark" data-action="setTheme">
            <span data-i18n="dark"></span>
          </label>
        </div>
      </section>
    </div>
  </smb-dialog>
  <smb-dialog id="script-dialog" style="anchor-name: --script-dialog-toast; --dialog-width: 430px;" action-dialog>
    <div id="script-dialog-toast" class="toast-container" style="position-anchor: --script-dialog-toast;"></div>
    <div class="scrollable-area">
      <form id="script-form" class="list-group rows-separated" data-action="saveScript">
        <div class="list-row entry-row">
          <input type="text" id="script-name" name="name" placeholder=" " autocomplete="off" maxlength="128" required autofocus>
          <label for="script-name" data-i18n="name"></label>
        </div>
        <div class="list-row entry-row multiline">
          <textarea id="script-content" name="content" placeholder=" " rows="5" maxlength="5000" required></textarea>
          <label for="script-content" data-i18n="scriptContent"></label>
        </div>
        <input type="hidden" id="script-id" name="id">
      </form>
    </div>
    <button slot="footer-left" class="button" type="button" data-i18n="cancel" data-dialog-close></button>
    <button slot="footer-right" class="button suggested-action" type="submit" form="script-form"></button>
  </smb-dialog>
